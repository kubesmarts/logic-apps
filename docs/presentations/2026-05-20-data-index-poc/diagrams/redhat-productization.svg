<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-rh" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-weight="bold" font-size="18" font-family="Arial" fill="#c00">Red Hat EFK Stack Integration</text>

  <!-- Current (FluentBit) -->
  <rect x="50" y="60" width="350" height="280" rx="8" fill="white" stroke="#1976d2" stroke-width="3"/>
  <rect x="50" y="60" width="350" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
  <text x="225" y="92" text-anchor="middle" font-weight="bold" font-size="16" font-family="Arial" fill="#1976d2">Current: FluentBit</text>

  <!-- FluentBit Stack -->
  <rect x="70" y="130" width="310" height="50" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="225" y="155" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">FluentBit DaemonSet</text>
  <text x="225" y="172" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Lightweight (450KB), C-based</text>

  <path d="M 225 180 L 225 210" stroke="#333" stroke-width="2" marker-end="url(#arrow-rh)" fill="none"/>

  <rect x="70" y="210" width="310" height="50" rx="6" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="225" y="235" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">PostgreSQL / Elasticsearch</text>
  <text x="225" y="252" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Data Index storage backend</text>

  <path d="M 225 260 L 225 290" stroke="#333" stroke-width="2" marker-end="url(#arrow-rh)" fill="none"/>

  <rect x="70" y="290" width="310" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="225" y="315" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">GraphQL API (Data Index)</text>

  <!-- Red Hat EFK (Fluentd) -->
  <rect x="500" y="60" width="350" height="280" rx="8" fill="white" stroke="#c00" stroke-width="3"/>
  <rect x="500" y="60" width="350" height="50" rx="8" fill="#ffebee" stroke="#c00" stroke-width="3"/>
  <text x="675" y="92" text-anchor="middle" font-weight="bold" font-size="16" font-family="Arial" fill="#c00">Red Hat Option: Fluentd (EFK)</text>

  <!-- Fluentd Stack -->
  <rect x="520" y="130" width="310" height="50" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="675" y="155" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">Fluentd DaemonSet</text>
  <text x="675" y="172" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Ruby-based, plugin ecosystem</text>

  <path d="M 675 180 L 675 210" stroke="#333" stroke-width="2" marker-end="url(#arrow-rh)" fill="none"/>

  <rect x="520" y="210" width="310" height="50" rx="6" fill="#ffebee" stroke="#c00" stroke-width="2"/>
  <text x="675" y="235" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">Red Hat EFK Elasticsearch</text>
  <text x="675" y="252" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Supported by Red Hat (MODE 2 compatible)</text>

  <path d="M 675 260 L 675 290" stroke="#333" stroke-width="2" marker-end="url(#arrow-rh)" fill="none"/>

  <rect x="520" y="290" width="310" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="675" y="315" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">GraphQL API (Data Index)</text>

  <!-- Comparison Arrow -->
  <path d="M 400 200 L 500 200" stroke="#666" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <text x="450" y="195" text-anchor="middle" font-size="12" font-family="Arial" fill="#666" font-weight="bold">vs</text>

  <!-- Bottom Notes -->
  <rect x="50" y="360" width="800" height="30" rx="6" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="450" y="380" text-anchor="middle" font-size="13" font-family="Arial" fill="#333" font-weight="bold">⚡ Both approaches work. FluentBit (current) is lighter. Red Hat EFK provides enterprise support + existing logging integration.</text>
</svg>
