version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      # Group Quarkus platform updates together
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.quarkus.platform*"
        update-types:
          - "minor"
          - "patch"
      # Group test dependencies together
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.testcontainers*"
          - "org.mockito*"
        update-types:
          - "minor"
          - "patch"
      # Group workflow/flow dependencies
      workflow:
        patterns:
          - "io.serverlessworkflow*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Docker (for container images in workflows/deployments)
  - package-ecosystem: "docker"
    directory: "/data-index/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
