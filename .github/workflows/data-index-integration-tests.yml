name: Data Index Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - 'data-index/**'
      - 'persistence-commons/**'
      - '.github/workflows/data-index-integration-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data-index/**'
      - 'persistence-commons/**'
      - '.github/workflows/data-index-integration-tests.yml'
  workflow_dispatch:

jobs:
  e2e-test:
    name: E2E - ${{ matrix.mode.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: MODE 1 (PostgreSQL + FluentBit + Triggers)
            script: test-mode1-e2e.sh
            id: mode1
          - name: MODE 2 (Elasticsearch + Vector + Transforms)
            script: test-mode2-e2e.sh
            id: mode2
          - name: MODE 3 (Kafka + CloudEvents + Processors)
            script: test-mode3-e2e.sh
            id: mode3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: |
          mvn -B clean install -DskipTests \
            --no-transfer-progress

      - name: Build MODE 1 images (PostgreSQL backend)
        if: matrix.mode.id == 'mode1' || matrix.mode.id == 'mode3'
        run: |
          # Build data-index-service-postgresql
          mvn -B package -DskipTests \
            -pl data-index/data-index-service/data-index-service-postgresql \
            -am \
            -DskipFlyway=true \
            -Dquarkus.container-image.build=true \
            --no-transfer-progress

          # Build workflow-test-app
          mvn -B package -DskipTests \
            -pl data-index/workflow-test-app \
            -Dquarkus.container-image.build=true \
            --no-transfer-progress

      - name: Build MODE 2 images (Elasticsearch backend)
        if: matrix.mode.id == 'mode2'
        run: |
          # Build data-index-service-elasticsearch
          mvn -B package -DskipTests \
            -pl data-index/data-index-service/data-index-service-elasticsearch \
            -am \
            -Dquarkus.container-image.build=true \
            --no-transfer-progress

          # Build workflow-test-app
          mvn -B package -DskipTests \
            -pl data-index/workflow-test-app \
            -Dquarkus.container-image.build=true \
            --no-transfer-progress

      - name: Build MODE 3 images (Kafka ingestion)
        if: matrix.mode.id == 'mode3'
        run: |
          # Build data-index-ingestion-kafka-service
          mvn -B package -DskipTests \
            -pl data-index/data-index-ingestion/data-index-ingestion-kafka-service \
            -am \
            -Dquarkus.container-image.build=true \
            --no-transfer-progress

      - name: Set up KIND cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: data-index-test
          config: data-index/scripts/kind/kind-config.yaml
          wait: 3m

      - name: Load MODE 1 images into KIND
        if: matrix.mode.id == 'mode1'
        run: |
          kind load docker-image kubesmarts/data-index-service-postgresql:999-SNAPSHOT \
            --name data-index-test
          kind load docker-image kubesmarts/workflow-test-app:999-SNAPSHOT \
            --name data-index-test

      - name: Load MODE 2 images into KIND
        if: matrix.mode.id == 'mode2'
        run: |
          kind load docker-image kubesmarts/data-index-service-elasticsearch:999-SNAPSHOT \
            --name data-index-test
          kind load docker-image kubesmarts/workflow-test-app:999-SNAPSHOT \
            --name data-index-test

      - name: Load MODE 3 images into KIND
        if: matrix.mode.id == 'mode3'
        run: |
          kind load docker-image kubesmarts/data-index-service-postgresql:999-SNAPSHOT \
            --name data-index-test
          kind load docker-image kubesmarts/data-index-ingestion-kafka-service:999-SNAPSHOT \
            --name data-index-test
          kind load docker-image kubesmarts/workflow-test-app:999-SNAPSHOT \
            --name data-index-test

      - name: Run E2E test script
        run: |
          cd data-index/scripts/kind
          bash ${{ matrix.mode.script }}

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== All Pods ==="
          kubectl get pods --all-namespaces

          echo ""
          echo "=== All Services ==="
          kubectl get svc --all-namespaces

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode1" ] || [ "${{ matrix.mode.id }}" == "mode3" ]; then
            echo "=== PostgreSQL Logs ==="
            kubectl logs -n postgresql -l app=postgresql --tail=100 || true
          fi

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode2" ]; then
            echo "=== Elasticsearch Logs ==="
            kubectl logs -n elasticsearch -l app=elasticsearch --tail=100 || true
          fi

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode3" ]; then
            echo "=== Kafka Logs ==="
            kubectl logs -n kafka kafka-0 --tail=100 || true

            echo ""
            echo "=== Ingestion Service Logs ==="
            kubectl logs -n data-index -l app=data-index-ingestion-kafka-service --tail=100 || true
          fi

          echo ""
          echo "=== Data Index Service Logs ==="
          kubectl logs -n data-index -l app=data-index-service --tail=100 || true

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode1" ]; then
            echo "=== FluentBit Logs (MODE 1) ==="
            kubectl logs -n logging -l app=workflows-fluent-bit-mode1 --tail=100 || true
          fi

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode2" ]; then
            echo "=== Vector Logs (MODE 2) ==="
            kubectl logs -n logging -l app=workflows-vector-mode2 --tail=100 || true
          fi

          echo ""
          echo "=== Workflow App Logs ==="
          kubectl logs -n workflows -l app=workflow-test-app --tail=100 || true

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name data-index-test || true

  summary:
    name: All Tests Summary
    runs-on: ubuntu-latest
    needs: e2e-test
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.e2e-test.result }}" == "success" ]; then
            echo "✅ All E2E tests passed!"
            exit 0
          else
            echo "❌ Some E2E tests failed"
            exit 1
          fi
