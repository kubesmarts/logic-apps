name: Data Index Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - 'data-index/**'
      - 'persistence-commons/**'
      - '.github/workflows/data-index-integration-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data-index/**'
      - 'persistence-commons/**'
      - '.github/workflows/data-index-integration-tests.yml'
  workflow_dispatch:

jobs:
  e2e-test:
    name: E2E - ${{ matrix.mode.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: MODE 1 (PostgreSQL + FluentBit + Triggers)
            script: full-test-mode1.sh
            id: mode1
          - name: MODE 2 (Elasticsearch + Vector + Transforms)
            script: full-test-mode2.sh
            id: mode2
          - name: MODE 3 (Kafka + CloudEvents + Processors)
            script: full-test-mode3.sh
            id: mode3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Run Helm-based E2E test
        run: |
          cd data-index
          bash scripts/e2e/${{ matrix.mode.script }}

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== All Pods ==="
          kubectl get pods --all-namespaces

          echo ""
          echo "=== All Services ==="
          kubectl get svc --all-namespaces

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode1" ] || [ "${{ matrix.mode.id }}" == "mode3" ]; then
            echo "=== PostgreSQL Logs ==="
            kubectl logs -n postgresql -l app=postgresql --tail=100 || true
          fi

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode2" ]; then
            echo "=== Elasticsearch Logs ==="
            kubectl logs -n elasticsearch -l app=elasticsearch --tail=100 || true
          fi

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode3" ]; then
            echo "=== Kafka Logs ==="
            kubectl logs -n kafka kafka-0 --tail=100 || true

            echo ""
            echo "=== Ingestion Service Logs ==="
            kubectl logs -l app=data-index-ingestion --tail=100 || true
          fi

          echo ""
          echo "=== Data Index Service Logs ==="
          kubectl logs -l app=data-index-service --tail=100 || true

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode1" ]; then
            echo "=== FluentBit Logs (MODE 1) ==="
            kubectl logs -n logging -l app=fluentbit --tail=100 || true
          fi

          echo ""
          if [ "${{ matrix.mode.id }}" == "mode2" ]; then
            echo "=== Vector Logs (MODE 2) ==="
            kubectl logs -n logging -l app=vector --tail=100 || true
          fi

          echo ""
          echo "=== Workflow App Logs ==="
          kubectl logs -n workflows -l app=workflow-test-app --tail=100 || true

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name data-index-test || true

  summary:
    name: All Tests Summary
    runs-on: ubuntu-latest
    needs: e2e-test
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.e2e-test.result }}" == "success" ]; then
            echo "✅ All E2E tests passed!"
            exit 0
          else
            echo "❌ Some E2E tests failed"
            exit 1
          fi
