name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v prefix (e.g., 1.0.0, 2.0.0-Alpha4)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?$'
          if [[ ! "${RELEASE}" =~ ${SEMVER} ]]; then
            echo "❌ ERROR: version ${RELEASE} must be MAJOR.MINOR.PATCH[-PRERELEASE], without the v prefix"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      # GITHUB_TOKEN on purpose: this tag push must not trigger publish-images.yml, the publish job calls it.
      - name: Create tag
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE}" > /dev/null; then
            echo "❌ ERROR: tag v${RELEASE} already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${RELEASE}" -m "Release v${RELEASE}"
          git push origin "v${RELEASE}"

  publish:
    name: Publish images
    needs: tag
    uses: ./.github/workflows/publish-images.yml
    secrets: inherit
    with:
      tag: v${{ inputs.version }}
      release: true
