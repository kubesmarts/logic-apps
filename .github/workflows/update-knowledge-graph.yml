name: Update Knowledge Graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.graphify/**'
      - 'graphify-out'
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install graphify
        run: |
          pip install graphifyy
          graphify --version

      - name: Update knowledge graph
        run: |
          # Run incremental update if graph exists, otherwise full build
          if [ -f .graphify/graph.json ]; then
            echo "Running incremental update..."
            graphify --update
          else
            echo "Building initial graph..."
            graphify .
          fi

      - name: Check for changes
        id: check_changes
        run: |
          # Use git status to catch both modified and untracked files
          if [ -z "$(git status --porcelain .graphify/)" ]; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Graph updated, changes detected"
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .graphify/ graphify-out
          git commit -m "chore: update knowledge graph [skip ci]"
          git push
