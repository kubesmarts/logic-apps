name: Deploy image to Quay.io

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (e.g., kubesmarts/data-index-service)'
        required: true
        type: string
      image_tag:
        description: 'Image tag (e.g., 1.0.0-postgresql)'
        required: true
        type: string
      artifact_name:
        description: 'Name of the OCI artifact to download (e.g., artifact-postgresql)'
        required: true
        type: string
      additional_tags:
        description: 'Comma-separated additional tags (e.g., latest-postgresql)'
        required: false
        type: string
        default: ''
    secrets:
      QUAY_ROBOT_ACCOUNT:
        description: 'Quay.io robot account name'
        required: true
      QUAY_ROBOT_TOKEN:
        description: 'Quay.io robot account token'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to Quay.io
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Load OCI image from artifact
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "📦 Loading OCI image from artifact using skopeo..."
          gunzip ${{ inputs.artifact_name }}.tar.gz

          # Copy from OCI archive to docker-daemon
          skopeo copy \
            oci-archive:${{ inputs.artifact_name }}.tar \
            docker-daemon:localhost/${IMAGE_NAME}:${IMAGE_TAG}

          echo "✅ Image loaded to docker daemon"
          docker images localhost/${IMAGE_NAME}:${IMAGE_TAG}

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_ACCOUNT }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Tag and push image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ADDITIONAL_TAGS: ${{ inputs.additional_tags }}
        run: |
          SOURCE_TAG="localhost/${IMAGE_NAME}:${IMAGE_TAG}"

          # Tag with main version
          TARGET_TAG="quay.io/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "🏷️  Tagging: ${SOURCE_TAG} → ${TARGET_TAG}"
          docker tag "${SOURCE_TAG}" "${TARGET_TAG}"
          docker push "${TARGET_TAG}"

          # Tag with additional tags if provided
          if [ -n "${ADDITIONAL_TAGS}" ]; then
            IFS=',' read -ra ADDITIONAL <<< "${ADDITIONAL_TAGS}"
            for tag in "${ADDITIONAL[@]}"; do
              EXTRA_TAG="quay.io/${IMAGE_NAME}:${tag}"
              echo "🏷️  Tagging: ${SOURCE_TAG} → ${EXTRA_TAG}"
              docker tag "${SOURCE_TAG}" "${EXTRA_TAG}"
              docker push "${EXTRA_TAG}"
            done
          fi

      - name: Verify image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "🔍 Verifying published image..."
          docker pull "quay.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker inspect "quay.io/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "✅ Image successfully published!"

      - name: Summary
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ADDITIONAL_TAGS: ${{ inputs.additional_tags }}
        run: |
          echo "### 🎉 Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`quay.io/${IMAGE_NAME}:${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Additional tags:**" >> $GITHUB_STEP_SUMMARY
          if [ -n "${ADDITIONAL_TAGS}" ]; then
            IFS=',' read -ra ADDITIONAL <<< "${ADDITIONAL_TAGS}"
            for tag in "${ADDITIONAL[@]}"; do
              echo "- \`quay.io/${IMAGE_NAME}:${tag}\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "- None" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View on Quay.io: https://quay.io/repository/${IMAGE_NAME}" >> $GITHUB_STEP_SUMMARY
