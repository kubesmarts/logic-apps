<svg viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-fb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Kubernetes Cluster Box -->
  <rect x="20" y="20" width="960" height="410" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="500" y="50" text-anchor="middle" font-weight="bold" font-size="18" font-family="Arial" fill="#1976d2">Kubernetes Cluster</text>

  <!-- Node 1 -->
  <rect x="50" y="80" width="280" height="320" rx="8" fill="white" stroke="#666" stroke-width="2"/>
  <text x="190" y="105" text-anchor="middle" font-weight="bold" font-size="14" font-family="Arial">Node 1</text>

  <!-- Workflow Pods on Node 1 -->
  <rect x="70" y="120" width="240" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="190" y="145" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Workflow Pod 1</text>
  <text x="190" y="165" text-anchor="middle" font-size="10" font-family="Arial" fill="#666">/tmp/quarkus-flow-events.log</text>

  <rect x="70" y="190" width="240" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="190" y="215" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Workflow Pod 2</text>
  <text x="190" y="235" text-anchor="middle" font-size="10" font-family="Arial" fill="#666">/tmp/quarkus-flow-events.log</text>

  <!-- FluentBit Pod on Node 1 -->
  <rect x="70" y="270" width="240" height="110" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="3"/>
  <text x="190" y="295" text-anchor="middle" font-size="13" font-family="Arial" font-weight="bold" fill="#f57c00">FluentBit DaemonSet Pod</text>
  <text x="190" y="315" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Tails: /var/log/containers/*.log</text>
  <text x="190" y="335" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Filters: JSON events only</text>
  <text x="190" y="355" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Batches: 1000 events/request</text>
  <text x="190" y="375" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Buffer: 5MB (drops oldest)</text>

  <!-- Node 2 -->
  <rect x="360" y="80" width="280" height="320" rx="8" fill="white" stroke="#666" stroke-width="2"/>
  <text x="500" y="105" text-anchor="middle" font-weight="bold" font-size="14" font-family="Arial">Node 2</text>

  <!-- Workflow Pods on Node 2 -->
  <rect x="380" y="120" width="240" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Workflow Pod 3</text>
  <text x="500" y="165" text-anchor="middle" font-size="10" font-family="Arial" fill="#666">/tmp/quarkus-flow-events.log</text>

  <rect x="380" y="190" width="240" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="215" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Workflow Pod 4</text>
  <text x="500" y="235" text-anchor="middle" font-size="10" font-family="Arial" fill="#666">/tmp/quarkus-flow-events.log</text>

  <!-- FluentBit Pod on Node 2 -->
  <rect x="380" y="270" width="240" height="110" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="3"/>
  <text x="500" y="295" text-anchor="middle" font-size="13" font-family="Arial" font-weight="bold" fill="#f57c00">FluentBit DaemonSet Pod</text>
  <text x="500" y="315" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Tails: /var/log/containers/*.log</text>
  <text x="500" y="335" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Filters: JSON events only</text>
  <text x="500" y="355" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Batches: 1000 events/request</text>
  <text x="500" y="375" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Buffer: 5MB (drops oldest)</text>

  <!-- Node N -->
  <rect x="670" y="80" width="280" height="320" rx="8" fill="white" stroke="#666" stroke-width="2"/>
  <text x="810" y="105" text-anchor="middle" font-weight="bold" font-size="14" font-family="Arial">Node N</text>

  <!-- Workflow Pods on Node N -->
  <rect x="690" y="120" width="240" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="810" y="145" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Workflow Pod N</text>
  <text x="810" y="165" text-anchor="middle" font-size="10" font-family="Arial" fill="#666">/tmp/quarkus-flow-events.log</text>

  <rect x="690" y="190" width="240" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="810" y="215" text-anchor="middle" font-size="12" font-family="Arial" font-weight="bold">Workflow Pod N+1</text>
  <text x="810" y="235" text-anchor="middle" font-size="10" font-family="Arial" fill="#666">/tmp/quarkus-flow-events.log</text>

  <!-- FluentBit Pod on Node N -->
  <rect x="690" y="270" width="240" height="110" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="3"/>
  <text x="810" y="295" text-anchor="middle" font-size="13" font-family="Arial" font-weight="bold" fill="#f57c00">FluentBit DaemonSet Pod</text>
  <text x="810" y="315" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Tails: /var/log/containers/*.log</text>
  <text x="810" y="335" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Filters: JSON events only</text>
  <text x="810" y="355" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Batches: 1000 events/request</text>
  <text x="810" y="375" text-anchor="middle" font-size="11" font-family="Arial" fill="#666">Buffer: 5MB (drops oldest)</text>

  <!-- Arrows to Storage -->
  <path d="M 190 380 L 190 440 L 500 440" stroke="#f57c00" stroke-width="3" marker-end="url(#arrow-fb)" fill="none"/>
  <path d="M 500 380 L 500 440" stroke="#f57c00" stroke-width="3" marker-end="url(#arrow-fb)" fill="none"/>
  <path d="M 810 380 L 810 440 L 500 440" stroke="#f57c00" stroke-width="3" marker-end="url(#arrow-fb)" fill="none"/>

  <text x="500" y="425" text-anchor="middle" font-size="12" font-family="Arial" fill="#666">Batched events to PostgreSQL/Elasticsearch</text>
</svg>
