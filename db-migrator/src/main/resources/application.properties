quarkus.banner.enabled=false

# jdbc.url/username/password are intentionally not set on the default datasource below -
# logic-operator provides QUARKUS_DATASOURCE_JDBC_URL/USERNAME/PASSWORD directly (see
# migrationEnvVars in internal/controller/migrationjob_objects.go), which Quarkus maps onto
# these properties via its standard env-var naming convention. The default datasource exists
# only to receive that connection info; every stream below runs through its own named
# datasource aliased to it, same as flow-quartz/data-index.
quarkus.datasource.db-kind=postgresql

# All three streams below share one physical database/schema (each gets its own history
# table, not its own schema), so whichever stream runs first leaves the schema non-empty
# for the others - Flyway's baseline-on-migrate + a baseline-version below every stream's
# first real script (V1.0.0/V2.0.0/V1) makes each stream create its own history table on
# that shared schema regardless of include order, without skipping any of its migrations.

# "flow-runtime" is a named datasource (rather than the default one) because
# quarkus-flow-db-migration's FlowDbMigrationLocationValidator only validates
# quarkus.flyway.locations against the active db-kind when quarkus.datasource."flow-runtime"
# is configured - pointing it at a plain/default datasource makes that check a silent no-op.
quarkus.datasource.flow-runtime.db-kind=postgresql
quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}
quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/postgresql
quarkus.flyway.flow-runtime.table=flyway_flow_runtime_history
quarkus.flyway.flow-runtime.migrate-at-start=false
quarkus.flyway.flow-runtime.baseline-on-migrate=true
quarkus.flyway.flow-runtime.baseline-version=0

# "flow-quartz" and "data-index" are likewise separate named datasources so each stream keeps
# its own isolated Flyway history, per quarkus-flow-db-migration-quartz's design (see its
# FlowDbMigrationQuartzLocationValidator, which hard-requires this datasource name and
# location). They're aliased to the same JDBC connection as the default datasource above
# rather than given their own credentials - logic-operator only injects connection env vars
# for the default datasource (see MigrationIncludeEnvVar/migrationEnvVars in logic-operator),
# and all three streams target the same physical database anyway.
quarkus.datasource.flow-quartz.db-kind=postgresql
quarkus.datasource.flow-quartz.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.flow-quartz.username=${quarkus.datasource.username}
quarkus.datasource.flow-quartz.password=${quarkus.datasource.password}
quarkus.flyway.flow-quartz.locations=db/flow-migration/quartz
quarkus.flyway.flow-quartz.table=flyway_flow_quartz_history
quarkus.flyway.flow-quartz.migrate-at-start=false
quarkus.flyway.flow-quartz.baseline-on-migrate=true
quarkus.flyway.flow-quartz.baseline-version=0

quarkus.datasource.data-index.db-kind=postgresql
quarkus.datasource.data-index.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.data-index.username=${quarkus.datasource.username}
quarkus.datasource.data-index.password=${quarkus.datasource.password}
quarkus.flyway.data-index.locations=db/migration
quarkus.flyway.data-index.table=flyway_data_index_history
quarkus.flyway.data-index.migrate-at-start=false
quarkus.flyway.data-index.baseline-on-migrate=true
quarkus.flyway.data-index.baseline-version=0

# Comma-separated stream list; logic-operator sets this via LOGIC_DB_MIGRATOR_INCLUDE
# (see MigrationIncludeEnvVar in internal/controller/quarkus_constants.go) - the property
# name below is chosen so its auto-derived env var matches that exactly.
logic.db-migrator.include=runtime
# Kubernetes' default container termination-message path; override for local runs.
db-migrator.termination-log-path=/dev/termination-log
