# ============================================================================
# Vector Configuration - MODE 1: JDBC Batch Normalization
# ============================================================================
#
# Validation: Vector does not have a reliable JSON Schema for IDE validation
# - Use Vector CLI: `vector validate --config-yaml vector.yaml`
# - Or our Maven tests: `mvn verify -pl collectors`
# - Vector documentation: https://vector.dev/docs/reference/configuration/
#
# Purpose: Capture Quarkus Flow structured logs from container stdout and
#          extract typed fields into the staging tables (workflow_events_raw,
#          task_events_raw). Pollers inside
#          data-index-service poll those tables and
#          idempotently normalizes them into workflow_instances/task_instances.
#
# Pipeline:
#   Quarkus Flow -> stdout -> K8s /var/log/containers/ -> Vector kubernetes_logs ->
#   Parse JSON events -> Filter workflow events -> Route by event type ->
#   Extract typed fields -> PostgreSQL INSERT (workflow_events_raw / task_events_raw) ->
#   [data-index-service polls, normalizes, deletes] -> Normalized tables
#
# Requires: Vector >= 0.46.0 (native `postgres` sink).
#
# Consumed by: logic-operator (templates this config with environment-specific values)
# Maintained by: data-index (guarantees this config works correctly)
#
# ============================================================================

# Data directory for checkpointing
# In production, DaemonSet mounts an emptyDir at this path
data_dir: /tmp/vector

# https://vector.dev/docs/reference/configuration/sources/kubernetes_logs
sources:
  # Kubernetes container logs
  kubernetes_logs:
    type: kubernetes_logs

    # Filter by namespace using field selector
    # Only tail logs from workflow namespace (set via environment variable in DaemonSet)
    extra_field_selector: "metadata.namespace=${WORKFLOW_NAMESPACE}"

    # Auto-merge partial logs (multi-line)
    auto_partial_merge: true

    # Self node name (set by DaemonSet env var)
    self_node_name: "${NODE_NAME}"

  # Internal metrics for Prometheus export
  internal_metrics:
    type: internal_metrics

transforms:
  # Parse the JSON log line into a dedicated field.
  #
  # We keep the parsed event under `.flow_event` (rather than merging it into
  # the root) so it stays isolated from Kubernetes/Vector metadata. The
  # `build_*_row` transforms below read `.flow_event`'s fields individually to
  # build the typed staging-table row.
  parse_json:
    type: remap
    inputs:
      - kubernetes_logs
    source: |
      # Silently drop non-JSON lines (regular app logs like INFO, DEBUG, etc.)
      parsed, err = parse_json(.message)
      if err != null {
        abort
      }
      .flow_event = parsed

  # Keep only structured workflow events (eventType starting with
  # "io.serverlessworkflow."). Filters out regular application logs, including
  # JSON log lines that parse but carry no eventType (`string(...) ?? ""`).
  filter_workflow_events:
    type: filter
    inputs:
      - parse_json
    condition:
      type: vrl
      source: starts_with(string(.flow_event.eventType) ?? "", "io.serverlessworkflow.")

  # Route events by type (workflow vs task).
  route_by_type:
    type: route
    inputs:
      - filter_workflow_events
    route:
      workflow_events:
        type: vrl
        source: starts_with(string(.flow_event.eventType) ?? "", "io.serverlessworkflow.workflow.")

      task_events:
        type: vrl
        source: starts_with(string(.flow_event.eventType) ?? "", "io.serverlessworkflow.task.")

  # Extract typed fields from the parsed Quarkus Flow event into the columns
  # of workflow_events_raw (see V1__initial_schema.sql). This is Vector doing
  # the field extraction that used to live in a PostgreSQL trigger - the
  # data-index-service poller consumes these columns directly, no JSONB
  # blob and no trigger involved.
  build_workflow_row:
    type: remap
    inputs:
      - route_by_type.workflow_events
    source: |
      instance_id = string(.flow_event.instanceId) ?? null
      namespace = string(.flow_event.workflowNamespace) ?? null
      name = string(.flow_event.workflowName) ?? null
      version = string(.flow_event.workflowVersion) ?? null
      status = string(.flow_event.status) ?? null

      started_at = null
      if exists(.flow_event.startTime) {
        seconds, err = to_float(.flow_event.startTime)
        if err == null {
          started_at = from_unix_timestamp(to_int(seconds * 1000), unit: "milliseconds") ?? null
        }
      }

      ended_at = null
      if exists(.flow_event.endTime) {
        seconds, err = to_float(.flow_event.endTime)
        if err == null {
          ended_at = from_unix_timestamp(to_int(seconds * 1000), unit: "milliseconds") ?? null
        }
      }

      last_update = null
      if exists(.flow_event.lastUpdateTime) {
        seconds, err = to_float(.flow_event.lastUpdateTime)
        if err == null {
          last_update = from_unix_timestamp(to_int(seconds * 1000), unit: "milliseconds") ?? null
        }
      }

      event_timestamp = null
      if exists(.flow_event.timestamp) {
        seconds, err = to_float(.flow_event.timestamp)
        if err == null {
          event_timestamp = from_unix_timestamp(to_int(seconds * 1000), unit: "milliseconds") ?? null
        }
      }

      input = null
      if exists(.flow_event.input) {
        input = encode_json(.flow_event.input)
      }

      output = null
      if exists(.flow_event.output) {
        output = encode_json(.flow_event.output)
      }

      . = {
        "instance_id": instance_id,
        "namespace": namespace,
        "name": name,
        "version": version,
        "status": status,
        "started_at": started_at,
        "ended_at": ended_at,
        "last_update": last_update,
        "input": input,
        "output": output,
        "error_type": string(.flow_event.error.type) ?? null,
        "error_title": string(.flow_event.error.title) ?? null,
        "error_detail": string(.flow_event.error.detail) ?? null,
        "error_status": to_int(.flow_event.error.status) ?? null,
        "error_instance": string(.flow_event.error.instance) ?? null,
        "event_timestamp": event_timestamp,
        "inserted_at": now()
      }

  build_task_row:
    type: remap
    inputs:
      - route_by_type.task_events
    source: |
      instance_id = string(.flow_event.instanceId) ?? null
      task_name = string(.flow_event.taskName) ?? null
      task = string(.flow_event.taskPosition) ?? null
      status = string(.flow_event.status) ?? null

      started_at = null
      if exists(.flow_event.startTime) {
        seconds, err = to_float(.flow_event.startTime)
        if err == null {
          started_at = from_unix_timestamp(to_int(seconds * 1000), unit: "milliseconds") ?? null
        }
      }

      ended_at = null
      if exists(.flow_event.endTime) {
        seconds, err = to_float(.flow_event.endTime)
        if err == null {
          ended_at = from_unix_timestamp(to_int(seconds * 1000), unit: "milliseconds") ?? null
        }
      }

      event_timestamp = null
      if exists(.flow_event.timestamp) {
        seconds, err = to_float(.flow_event.timestamp)
        if err == null {
          event_timestamp = from_unix_timestamp(to_int(seconds * 1000), unit: "milliseconds") ?? null
        }
      }

      input = null
      if exists(.flow_event.input) {
        input = encode_json(.flow_event.input)
      }

      output = null
      if exists(.flow_event.output) {
        output = encode_json(.flow_event.output)
      }

      . = {
        "instance_id": instance_id,
        "task_name": task_name,
        "task": task,
        "status": status,
        "started_at": started_at,
        "ended_at": ended_at,
        "input": input,
        "output": output,
        "error_type": string(.flow_event.error.type) ?? null,
        "error_title": string(.flow_event.error.title) ?? null,
        "error_detail": string(.flow_event.error.detail) ?? null,
        "error_status": to_int(.flow_event.error.status) ?? null,
        "error_instance": string(.flow_event.error.instance) ?? null,
        "event_timestamp": event_timestamp,
        # Same reasoning as build_workflow_row above.
        "inserted_at": now()
      }

  # Debug filter - only pass events if DEBUG_EVENTS=true
  # Controlled by environment variable for troubleshooting
  # WARNING: At 1000 events/sec, generates ~43GB/day of logs
  debug_filter:
    type: filter
    inputs:
      - build_workflow_row
      - build_task_row
    condition:
      type: vrl
      source: |
        debug_enabled = get_env_var("DEBUG_EVENTS") ?? "false"
        to_bool(debug_enabled) ?? false

# ============================================================================
# SINKS: PostgreSQL Staging Tables
# ============================================================================
#
# Vector's `postgres` sink cannot template the table name per-event, so we use
# one sink per staging table. Each sink serializes the event to JSON and maps
# the top-level fields (instance_id, status, started_at, ...) to the matching
# typed table columns via jsonb_populate_recordset - extra fields are ignored,
# missing ones become SQL NULL.
#
# This is a plain append-only INSERT, not an UPSERT - there's no trigger and
# no ON CONFLICT here anymore. A batch is sent as a single multi-row INSERT;
# the only way one row can fail the whole batch is a NOT NULL violation
# (instance_id, or task for task rows) on a malformed event, and Vector
# retries the whole batch INSERT. If poison-pill rows appear in practice,
# set `batch.max_events: 1` to isolate them to single-row batches instead
# of lowering max_events as a blanket default.
#
# Buffer: the default in-memory buffer (matches the FluentBit MODE 1 setup this
# originally replaced). Do NOT switch to `buffer.type: disk` here - in Vector
# 0.54 the postgres sink does not drain a small disk buffer until graceful
# shutdown, which strands low-volume events. The kubernetes_logs source
# checkpoints, so a Vector restart re-reads recent lines; re-inserted staging
# rows are harmless duplicates since the data-index-service poller's
# normalization UPSERT is idempotent.
# https://vector.dev/docs/reference/configuration/sinks/postgres/
sinks:
  # Workflow events -> workflow_events_raw
  postgres_workflow:
    type: postgres
    inputs:
      - build_workflow_row
    endpoint: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?options=-c%20search_path%3D${POSTGRES_SCHEMA}"
    table: workflow_events_raw
    healthcheck:
      enabled: true
    batch:
      max_events: 100
      timeout_secs: 1

  # Task events -> task_events_raw
  postgres_task:
    type: postgres
    inputs:
      - build_task_row
    endpoint: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?options=-c%20search_path%3D${POSTGRES_SCHEMA}"
    table: task_events_raw
    healthcheck:
      enabled: true
    batch:
      max_events: 100
      timeout_secs: 1

  # ============================================================================
  # DEBUG SINK - Troubleshooting Only
  # ============================================================================
  #
  # Logs all workflow/task events to stdout for troubleshooting.
  # DISABLED BY DEFAULT - controlled by the DEBUG_EVENTS environment variable.
  #
  # WARNING: At high event rates, this generates massive log volumes:
  #   - 1,000 events/sec = ~43 GB/day
  #   - 10,000 events/sec = ~430 GB/day
  #
  # To enable for troubleshooting:
  #   kubectl set env daemonset/vector -n logging DEBUG_EVENTS=true
  #   kubectl logs -n logging -l app=vector -f
  #
  # To disable:
  #   kubectl set env daemonset/vector -n logging DEBUG_EVENTS-
  debug_stdout:
    type: console
    inputs:
      - debug_filter
    encoding:
      codec: json

  # Export internal metrics to Prometheus
  prometheus_metrics:
    type: prometheus_exporter
    inputs:
      - internal_metrics
    address: "0.0.0.0:9598"
    default_namespace: vector

# ============================================================================
# OBSERVABILITY
# ============================================================================

# Expose HTTP API on :8686 for health checks
# Prometheus metrics exposed via prometheus_exporter sink on :9598
api:
  enabled: true
  address: "0.0.0.0:8686"

# ============================================================================
# NOTES
# ============================================================================
#
# Environment Variables (templated by logic-operator):
#   - WORKFLOW_NAMESPACE: Namespace to tail logs from (default: workflows)
#   - POSTGRES_HOST: PostgreSQL hostname
#   - POSTGRES_PORT: PostgreSQL port (default: 5432)
#   - POSTGRES_DB: PostgreSQL database name
#   - POSTGRES_SCHEMA: PostgreSQL schema name via search_path (default: public, must match Flyway migrations)
#   - POSTGRES_USER: PostgreSQL user
#   - POSTGRES_PASSWORD: PostgreSQL password
#   - NODE_NAME: Kubernetes node name (set by DaemonSet downward API)
#   - DEBUG_EVENTS: Enable stdout logging of events (default: false)
#       * ONLY FOR TROUBLESHOOTING - disabled in production
#       * WARNING: At 1000 events/sec, generates ~43GB/day of logs
#
# Handled downstream by data-index-service, not Vector
# or a PostgreSQL trigger:
#   - Polling workflow_events_raw / task_events_raw in batches
#   - Field-level idempotency (COALESCE) and out-of-order event handling,
#     via the same WorkflowPersistence/TaskPersistence UPSERT MODE 3 uses
#   - Composite task identity (instance_id, task)
#   - Deleting staging rows once normalized, and routing rows that fail
#     normalization to workflow_events_dlq / task_events_dlq
#
# What this config does:
#   * Tails Kubernetes container logs
#   * Parses CRI/Docker format automatically
#   * Filters workflow events (by eventType field)
#   * Routes by event type (workflow vs task)
#   * Extracts typed fields and inserts into workflow_events_raw / task_events_raw
#   * Exposes Prometheus metrics
#
# ============================================================================
