site:
  title: Data Index Documentation
  start_page: data-index:ROOT:index.adoc
content:
  sources:
    - url: ../..
      branches: HEAD
      start_path: data-index/data-index-docs
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: false

asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    # Diagrams are rendered by a Kroki server at build time and saved into the site,
    # so /docs works offline. Override kroki-server-url to use a self-hosted Kroki.
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: ''
    page-pagination: ''
    hide-uri-scheme: '@'
    tabs-sync-option: '@'

output:
  dir: ./target/generated-docs
