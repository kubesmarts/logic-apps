# ============================================================================
# MODE 1: PostgreSQL + Vector + JDBC Batch Normalization
# ============================================================================
#
# Override values for MODE 1 deployment.
# Base values are in values.yaml - only specify differences here.
#
# Architecture:
#   Quarkus Flow → stdout → Vector (kubernetes_logs) → staging tables
#   (workflow_events_raw/task_events_raw) → data-index-jdbc-batch polls,
#   normalizes idempotently → Normalized tables → GraphQL API
#
# No PostgreSQL triggers - normalization happens in data-index-jdbc-batch.
#
# ============================================================================

mode: mode1

# PostgreSQL backend - already enabled in base values.yaml
# No need to override unless changing defaults
postgresql:
  enabled: true
  # Use NodePort for easy testing in KIND
  service:
    type: NodePort

# Elasticsearch - disabled for MODE 1
elasticsearch:
  enabled: false

# Kafka - disabled for MODE 1
kafka:
  enabled: false

# Vector - MODE 1 log collector (postgres sink -> staging tables -> jdbc-batch polls)
vector:
  enabled: true
  config: mode1-postgresql

# Data Index Service - PostgreSQL variant
dataIndex:
  image:
    repository: kubesmarts/data-index-service
    tag: "2.0.0-SNAPSHOT-postgresql"
  storage: postgresql
  # Use NodePort for easy testing in KIND
  service:
    type: NodePort

# Data Index Ingestion (Kafka) - disabled for MODE 1 (no Kafka)
dataIndexIngestion:
  enabled: false

# Data Index JDBC Batch Ingestion - MODE 1's normalization service
# (polls workflow_events_raw/task_events_raw; no PostgreSQL triggers)
dataIndexJdbcBatch:
  enabled: true
  image:
    repository: kubesmarts/data-index-ingestion
    tag: "2.0.0-SNAPSHOT-jdbc-batch"
  service:
    type: NodePort

# Workflow Test App - enabled
workflowApp:
  enabled: true
  # Use NodePort for easy testing in KIND
  service:
    type: NodePort
