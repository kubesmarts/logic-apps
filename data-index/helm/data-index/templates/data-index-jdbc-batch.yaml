{{- if .Values.dataIndexJdbcBatch.enabled }}
{{/*
Data Index JDBC Batch Ingestion Service (MODE 1 only)
Polls workflow_events_raw/task_events_raw (populated by Vector) in batches and
normalizes them into workflow_instances/task_instances using the same
idempotent JDBC persistence layer MODE 3 uses.
*/}}

---
apiVersion: v1
kind: Service
metadata:
  name: data-index-jdbc-batch
  namespace: {{ include "data-index.namespace" . }}
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: data-index-jdbc-batch
spec:
  type: {{ .Values.dataIndexJdbcBatch.service.type }}
  ports:
    - name: http
      port: {{ .Values.dataIndexJdbcBatch.service.port }}
      targetPort: 8080
      protocol: TCP
      {{- if and (eq .Values.dataIndexJdbcBatch.service.type "NodePort") .Values.dataIndexJdbcBatch.service.nodePort }}
      nodePort: {{ .Values.dataIndexJdbcBatch.service.nodePort }}
      {{- end }}
  selector:
    app: data-index-jdbc-batch

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-index-jdbc-batch
  namespace: {{ include "data-index.namespace" . }}
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: data-index-jdbc-batch
spec:
  replicas: {{ .Values.dataIndexJdbcBatch.replicas }}
  selector:
    matchLabels:
      app: data-index-jdbc-batch
  template:
    metadata:
      labels:
        app: data-index-jdbc-batch
        mode: {{ .Values.mode }}
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.postgresql.host }} -p {{ .Values.postgresql.service.port }} -U {{ .Values.postgresql.username }}; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
      containers:
        - name: jdbc-batch
          image: "{{ .Values.dataIndexJdbcBatch.image.repository }}:{{ .Values.dataIndexJdbcBatch.image.tag }}"
          imagePullPolicy: {{ .Values.dataIndexJdbcBatch.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # PostgreSQL configuration
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:{{ include "data-index.postgresql.connectionString" . }}"
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret | default (printf "%s-postgresql" (include "data-index.fullname" .)) }}
                  key: postgres-username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret | default (printf "%s-postgresql" (include "data-index.fullname" .)) }}
                  key: postgres-password
            # JDBC batch polling configuration
            - name: DATA_INDEX_INGESTION_JDBC_BATCH_POLL_INTERVAL
              value: {{ .Values.dataIndexJdbcBatch.pollInterval | default "1s" | quote }}
            - name: DATA_INDEX_INGESTION_JDBC_BATCH_BATCH_SIZE
              value: {{ .Values.dataIndexJdbcBatch.batchSize | default 1000 | quote }}
            - name: QUARKUS_HTTP_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.dataIndexJdbcBatch.resources | nindent 12 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
{{- end }}
