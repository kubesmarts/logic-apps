{{- if .Values.fluentbit.enabled }}
{{/*
FluentBit ConfigMap - MODE 1 (DEPRECATED)

DEPRECATED per ADR-0001: MODE 1 now uses Vector (templates/vector-configmap.yaml,
configs/vector/vector-mode1-postgresql.yaml). Kept for one release; removal target: next release.

Contains FluentBit configuration files:
- fluent-bit.conf: Main configuration
- parsers.conf: CRI parser for Kubernetes logs
- flatten-event.lua: Lua script to route events by type
*/}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: logging
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: fluentbit
data:
  fluent-bit.conf: |
{{ .Files.Get "configs/fluentbit/fluent-bit.conf" | indent 4 }}
  parsers.conf: |
{{ .Files.Get "configs/fluentbit/parsers.conf" | indent 4 }}
  flatten-event.lua: |
{{ .Files.Get "configs/fluentbit/flatten-event.lua" | indent 4 }}
{{- end }}
