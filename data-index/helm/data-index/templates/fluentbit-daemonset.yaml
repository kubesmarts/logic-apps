{{- if .Values.fluentbit.enabled }}
{{/*
FluentBit DaemonSet - MODE 1

Deploys FluentBit as a DaemonSet to collect logs from workflow pods.
Includes RBAC (ServiceAccount, ClusterRole, ClusterRoleBinding) for Kubernetes API access.

NOTE: FluentBit is temporary for MODE 1. Will migrate to Vector (issue #63).
*/}}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentbit
  namespace: logging
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: fluentbit

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentbit
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: fluentbit
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentbit
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: fluentbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentbit
subjects:
  - kind: ServiceAccount
    name: fluentbit
    namespace: logging

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit
  namespace: logging
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: fluentbit
spec:
  selector:
    matchLabels:
      app: fluentbit
  template:
    metadata:
      labels:
        app: fluentbit
        mode: {{ .Values.mode }}
    spec:
      serviceAccountName: fluentbit
      containers:
        - name: fluentbit
          image: "{{ .Values.fluentbit.image.repository }}:{{ .Values.fluentbit.image.tag }}"
          imagePullPolicy: {{ .Values.fluentbit.image.pullPolicy }}
          env:
            - name: WORKFLOW_NAMESPACE
              value: {{ .Values.fluentbit.workflowNamespace | quote }}
            - name: POSTGRES_HOST
              value: postgresql.postgresql.svc.cluster.local
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: tail-db
              mountPath: /tail-db
          resources:
            {{- toYaml .Values.fluentbit.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: fluentbit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: tail-db
          emptyDir: {}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      tolerations:
        # Allow DaemonSet to run on all nodes including control-plane
        - operator: Exists
          effect: NoSchedule
{{- end }}
