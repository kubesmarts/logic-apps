{{- if .Values.vector.enabled }}
{{/*
Vector ConfigMap
Embeds the mode-specific vector.yaml (configs/vector/vector-<vector.config>.yaml):
  mode1-postgresql  -> postgres sinks + PostgreSQL triggers
  mode2-elasticsearch -> elasticsearch sinks + ES transforms
*/}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
  labels:
    {{- include "data-index.labels" . | nindent 4 }}
    app: vector
data:
  vector.yaml: |
{{ .Files.Get (printf "configs/vector/vector-%s.yaml" .Values.vector.config) | indent 4 }}
{{- end }}
