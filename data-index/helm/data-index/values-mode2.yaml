# ============================================================================
# MODE 2: Elasticsearch + Vector + Transforms
# ============================================================================
#
# Override values for MODE 2 deployment.
# Base values are in values.yaml - only specify differences here.
#
# Architecture:
#   Quarkus Flow → stdout → Vector → Elasticsearch raw indices →
#   Elasticsearch Transforms → Normalized indices → GraphQL API
#
# ============================================================================

mode: mode2

# PostgreSQL - disabled for MODE 2
postgresql:
  enabled: false

# Elasticsearch backend
elasticsearch:
  enabled: true
  # Use NodePort for easy testing in KIND
  service:
    type: NodePort

# Kafka - disabled for MODE 2
kafka:
  enabled: false

# Vector - MODE 2 log collector (elasticsearch sink -> raw indices -> transforms)
vector:
  enabled: true
  config: mode2-elasticsearch

# Data Index Service - Elasticsearch variant
dataIndex:
  image:
    repository: kubesmarts/data-index-service-elasticsearch
    tag: "999-SNAPSHOT"
  storage: elasticsearch
  # Use NodePort for easy testing in KIND
  service:
    type: NodePort

# Data Index Ingestion - disabled for MODE 2 (no Kafka)
dataIndexIngestion:
  enabled: false

# Workflow Test App - enabled
workflowApp:
  enabled: true
  # Use NodePort for easy testing in KIND
  service:
    type: NodePort
