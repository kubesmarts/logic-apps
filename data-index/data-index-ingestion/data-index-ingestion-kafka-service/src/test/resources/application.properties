mp.messaging.incoming.data-index-events.connector=smallrye-kafka
mp.messaging.incoming.data-index-events.topic=flow-lifecycle-out
mp.messaging.incoming.data-index-events.group.id=data-index-ingestion-test
mp.messaging.incoming.data-index-events.auto.offset.reset=earliest
mp.messaging.incoming.data-index-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.data-index-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# CRITICAL: Match production configuration - batch processing mode
mp.messaging.incoming.data-index-events.batch=true
mp.messaging.incoming.data-index-events.cloud-events=false
mp.messaging.incoming.data-index-events.run-on-vertx-context=false

# DLQ configuration for testing
mp.messaging.incoming.data-index-events.failure-strategy=fail
mp.messaging.outgoing.data-index-events-dlq.connector=smallrye-kafka
mp.messaging.outgoing.data-index-events-dlq.topic=data-index-events-dlq
mp.messaging.outgoing.data-index-events-dlq.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.data-index-events-dlq.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Configure DB batch size for testing
data-index.ingestion.db-batch-size=1000

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration