mp.messaging.incoming.data-index-events.connector=smallrye-kafka
mp.messaging.incoming.data-index-events.topic=flow-lifecycle-out
mp.messaging.incoming.data-index-events.group.id=data-index-ingestion-test
mp.messaging.incoming.data-index-events.auto.offset.reset=earliest
mp.messaging.incoming.data-index-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.data-index-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# DLQ configuration for testing
mp.messaging.incoming.data-index-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.data-index-events.dead-letter-queue.topic=data-index-events-dlq
mp.messaging.incoming.data-index-events.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.data-index-events.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.data-index-events.retry-attempts=0

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration