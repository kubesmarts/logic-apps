quarkus.application.name=data-index-ingestion-jdbc-batch-service

# http
quarkus.http.port=8080
quarkus.http.enable-compression=true

# health
quarkus.smallrye-health.root-path=/q/health

# JDBC batch polling
data-index.ingestion.jdbc-batch.poll-interval=1s
data-index.ingestion.jdbc-batch.batch-size=1000

quarkus.native.resources.includes=workflow-events-select-batch.sql,workflow-events-delete-batch.sql,workflow-events-delete-single.sql,workflow-events-insert-dlq.sql,task-events-select-batch.sql,task-events-delete-batch.sql,task-events-delete-single.sql,task-events-insert-dlq.sql
