# PostgreSQL Integration Test Configuration
#
# This configuration is automatically applied to all tests in this module.
# The PostgreSQL profile is activated via maven-surefire-plugin in pom.xml.

# Index data-index modules for Quarkus
quarkus.index-dependency.data-index-service-core.group-id=org.kubesmarts.logic.apps
quarkus.index-dependency.data-index-service-core.artifact-id=data-index-service-core

quarkus.index-dependency.data-index-model.group-id=org.kubesmarts.logic.apps
quarkus.index-dependency.data-index-model.artifact-id=data-index-model

quarkus.index-dependency.data-index-service-postgresql.group-id=org.kubesmarts.logic.apps
quarkus.index-dependency.data-index-service-postgresql.artifact-id=data-index-service-postgresql

quarkus.index-dependency.data-index-ingestion-persistence.group-id=org.kubesmarts.logic.apps
quarkus.index-dependency.data-index-ingestion-persistence.artifact-id=data-index-ingestion-persistence

# MODE 1 polling
data-index.ingestion.jdbc-batch.enabled=true
data-index.ingestion.jdbc-batch.poll-interval=1s
data-index.ingestion.jdbc-batch.batch-size=1000

# PostgreSQL backend
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# Dev Services - auto-starts PostgreSQL 15 container for tests
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.db-name=dataindex
quarkus.datasource.devservices.username=dataindex
quarkus.datasource.devservices.password=dataindex123

# Hibernate ORM
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway - run migrations for tests
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=false

# Logging (reduce noise in test output)
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus.hibernate.orm".level=WARN
quarkus.log.category."org.flywaydb".level=INFO
